
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 15px;
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .download-btn {
      margin-top: 12px;
      padding: 8px 18px;
      background-color: #ff9800;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
    }
    .download-btn:hover {
      background-color: #e68a00;
    }
    .back-btn {
      display: block;
      width: fit-content;
      margin: 20px auto 0;
      color: #aaa;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>Photo Gallery</h1>

  <div class="gallery-grid">
    <!-- Update photo1.jpg to match your uploaded photo file name -->
    <div class="card">
      <img src="photo1.png" alt="Photo 1">
      <a href="photo1.jpg" download class="download-btn">Download</a>
    </div>

    <!-- Update photo2.jpg to match your uploaded photo file name -->
    <div class="card">
      <img src="photo2.jpg" alt="Photo 2">
      <a href="photo2.jpg" download class="download-btn">Download</a>
    </div>
  </div>

  <a href="index.html" class="back-btn">← Back to Home</a>

</body>
</html>
